function LOCAL(){let T=LS("fms-demo");if(!T)T={admins:{"u-admin":true},users:{"u-owner":{cid:"C10001",userId:"owner",name:"Demo Owner",level:"owner",active:true}},companies:{C10001:{profile:{name:"Demo Haulage Ltd",email:"demo@example.com",phone:"",status:"active",owner:"u-owner",created:Date.now()},staff:{"u-owner":{userId:"owner",name:"Demo Owner",level:"owner",active:true}}}}};
let A=LS("fms-demo-auth")||{"admin@fms.demo":{pw:"admin123",uid:"u-admin"},"owner@c10001.fms.app":{pw:"owner123",uid:"u-owner"}};
const sv=()=>{LS("fms-demo",T);LS("fms-demo-auth",A)},ks=p=>p.split("/").filter(Boolean),cp=v=>v==null?null:JSON.parse(JSON.stringify(v));
const o={get:async p=>{let x=T;for(const k of ks(p)){if(x==null)return null;x=x[k]}return cp(x)},

patch:async(p,v)=>{for(const k in v)await o.put(p+"/"+k,v[k])},del:p=>o.put(p,null),
signIn:async(e,p)=>{const a=A[e];if(!a||a.pw!==p)throw new Error("INVALID_LOGIN_CREDENTIALS");sessionStorage.setItem("fms-uid",a.uid);return{uid:a.uid}},
signUp:async(e,p,keep)=>{if(A[e])throw new Error("EMAIL_EXISTS");const uid="u"+Date.now()+Math.floor(Math.random()*1e3);A[e]={pw:p,uid};sv();if(!keep)sessionStorage.setItem("fms-uid",uid);return{uid}},
restore:async()=>sessionStorage.getItem("fms-uid"),signOut:()=>sessionStorage.removeItem("fms-uid")};return o}
function FB(){let tok=null;const U=CFG.databaseURL.replace(/\/+$/,""),K=CFG.apiKey,idt="https://identitytoolkit.googleapis.com/v1/accounts:";
async function post(url,body,form){const r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:form?body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||"Request failed");return d}
function set(d){tok={id:d.idToken||d.id_token,ref:d.refreshToken||d.refresh_token,exp:Date.now()+(+(d.expiresIn||d.expires_in)-60)*1e3,uid:d.localId||d.user_id};try{localStorage.setItem("fms-ref",tok.ref)}catch(e){}return tok}

return{signIn:async(e,p)=>({uid:set(await post(idt+"signInWithPassword?key="+K,{email:e,password:p,returnSecureToken:true})).uid}),
signUp:async(e,p,keep)=>{const d=await post(idt+"signUp?key="+K,{email:e,password:p,returnSecureToken:true});if(!keep)set(d);return{uid:d.localId}},
restore:async()=>{try{await id();return tok.uid}catch(e){return null}},signOut:()=>{tok=null;try{localStorage.removeItem("fms-ref")}catch(e){}},
get:(p,q)=>call("GET",p,undefined,q),put:(p,v)=>call("PUT",p,v),patch:(p,v)=>call("PATCH",p,v),del:p=>call("DELETE",p)}}
const BE=LIVE?FB():LOCAL();

async function loadCo(){const g=p=>BE.get(base()+"/"+p).catch(()=>null),[v,t,r,l,i,st]=await Promise.all([g("vehicles"),g("trips"),g("rates"),can("ledger")?g("ledger"):null,g("imports"),can("staff")?g("staff"):null]);
DB.assets=v||{};DB.trips=t?Object.values(t):[];R=Object.assign({},DEFR,r||{});L=l?Object.values(l):[];DB.reports=i?Object.values(i):[];ST=st||{};
if(S.sess.role==="user"&&S.sess.level==="owner"&&!ST[S.sess.uid]){ST[S.sess.uid]={userId:S.sess.userId,name:S.sess.name,level:"owner",active:true};BE.put(base()+"/staff/"+S.sess.uid,ST[S.sess.uid]).catch(()=>{})}}
/* ---------- extract data from the Daily Movement Report ---------- */
function parseSheet(rows){const meta=String(rows[0]&&rows[0][0]||"").replace(/\s+/g," "),mm=meta.match(/Daily Movement Report\s*(.*?)\s*From\s+([\d\/]+).*?To\s+([\d\/]+)/i);let cur=null,cols=null;const A={},T=[];

const bad=x=>/INVALID|NOT_FOUND|CREDENTIALS|PASSWORD/.test(x.message)?"Wrong Company ID, User ID or password.":x.message==="DENIED"?"Access denied.":x.message.replace(/_/g," ");

async function addStaff(e){e.preventDefault();const u=$("su").value.trim().toLowerCase(),pw=$("sp").value;if(!/^[a-z0-9._-]{3,20}$/.test(u))return toast("Worker ID: 3 to 20 letters, numbers, dots or dashes");if(pw.length<6)return toast("Password needs 6+ characters");

/* ---------- finance engine ---------- */
function cost(t){const fuel=t.km*R.cons/100*R.fuel,drv=t.drive/3600*R.drv,idle=t.stand/3600*R.idle,mnt=t.km*(R.mnt+R.tyr);return{fuel,drv,idle,mnt,rev:t.km*R.rev}}
function agg(ts,nf){const o={n:ts.length,km:0,drive:0,stand:0,fuel:0,drv:0,idle:0,mnt:0,rev:0,max:0,over:0},ds=new Set;ts.forEach(t=>{const c=cost(t);for(const k of["fuel","drv","idle","mnt","rev"])o[k]+=c[k];o.km+=t.km;o.drive+=t.drive;o.stand+=t.stand;o.max=Math.max(o.max,t.spd);if(t.spd>R.spd)o.over++;if(t.km>.5)ds.add(t.reg+dstr(t))});
o.days=ds.size;o.fix=nf?0:ds.size*R.fix;o.tot=o.fuel+o.drv+o.idle+o.mnt+o.fix;o.profit=o.rev-o.tot;o.cpk=o.km?o.tot/o.km:0;return o}
const F=()=>DB.trips.filter(t=>DB.assets[t.reg]&&(!vf||t.reg===vf)&&(!from||dstr(t)>=from)&&(!to||dstr(t)<=to)),FL=()=>L.filter(e=>(!vf||e.reg===vf||!e.reg)&&(!from||e.date>=from)&&(!to||e.date<=to));
const lsum=t=>FL().filter(e=>e.type===t).reduce((a,e)=>a+e.amt,0),vname=r=>(DB.assets[r]?DB.assets[r].desc:r).replace(/ - [A-Z0-9]+$/,"");
function pnl(){const a=agg(F()),li=lsum("income"),le=lsum("expense"),rv=a.rev+li,tc=a.tot+le,bud=a.days*R.bud;return{a,li,le,rv,tc,pr:rv-tc,mg:rv?(rv-tc)/rv*100:0,bud,var:bud-tc}}
/* ---------- reports ---------- */
function REP(k){const ts=F();
if(k==="sum"){const regs=[...new Set(ts.map(t=>t.reg))];return{title:"Vehicle cost report",head:["Vehicle","Reg","Trips","Distance km","Driving h","Idle h","Fuel $","Driver $","Idle $","Maint+tyres $","Fixed $","Total cost $","Revenue $","Profit $","Cost/km $"],rows:regs.map(r=>{const a=agg(ts.filter(t=>t.reg===r));return[vname(r),r,a.n,+a.km.toFixed(1),+hrs(a.drive),+hrs(a.stand),+a.fuel.toFixed(2),+a.drv.toFixed(2),+a.idle.toFixed(2),+a.mnt.toFixed(2),+a.fix.toFixed(2),+a.tot.toFixed(2),+a.rev.toFixed(2),+a.profit.toFixed(2),+a.cpk.toFixed(2)]})}}
if(k==="drv"){const ds=[...new Set(ts.map(t=>t.drv))];return{title:"Driver performance",head:["Driver","Trips","Distance km","Driving h","Max km/h","Speeding events","Est. cost $","Est. revenue $"],rows:ds.map(d=>{const a=agg(ts.filter(t=>t.drv===d),1);return[d,a.n,+a.km.toFixed(1),+hrs(a.drive),a.max,a.over,+a.tot.toFixed(2),+a.rev.toFixed(2)]})}}
if(k==="trp")return{title:"Trip log",head:["Date","Vehicle","Reg","Driver","Departed","From","Arrived","To","Distance km","Driving h","Max km/h","Standing h","Est. cost $"],rows:ts.slice().sort((a,b)=>a.dep-b.dep).map(t=>{const c=cost(t);return[dstr(t),vname(t.reg),t.reg,t.drv,hm(t.dep),t.from,hm(t.arr),t.to,+t.km.toFixed(2),+hrs(t.drive),t.spd,+hrs(t.stand),+(c.fuel+c.drv+c.idle+c.mnt).toFixed(2)]})};
const p=pnl(),f=x=>+x.toFixed(2);return{title:"Profit and loss",head:["Item","Amount $"],rows:[["Revenue from movement (est.)",f(p.a.rev)],["Other income (ledger)",f(p.li)],["Total revenue",f(p.rv)],["Fuel",f(p.a.fuel)],["Driver time",f(p.a.drv)],["Idle / standing",f(p.a.idle)],["Maintenance & tyres",f(p.a.mnt)],["Fixed (insurance, licences)",f(p.a.fix)],["Other expenses (ledger)",f(p.le)],["Total costs",f(p.tc)],["NET PROFIT",f(p.pr)],["Margin %",f(p.mg)],["Budget",f(p.bud)],["Budget variance (+ under)",f(p.var)]]}}
async function saveFile(name,blob){try{if(window.claude&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==="declined")return}
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
const period=()=>(from||to)?(from?dd(from):"start")+" to "+(to?dd(to):"latest"):"All dates",fn=(r,e)=>"FMS-"+r.title.replace(/\W+/g,"-").toLowerCase()+"."+e;
function out(k,fmt){if(!can("dl"))return toast("Your access level cannot download reports");const r=REP(k);if(!r.rows.length)return toast("No data to report. Import a report first.");
if(fmt==="csv"){const q=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};saveFile(fn(r,"csv"),new Blob(["\ufeff"+[r.head,...r.rows].map(x=>x.map(q).join(",")).join("\r\n")],{type:"text/csv"}))}
else if(fmt==="xlsx"){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([r.head,...r.rows]),r.title.slice(0,30));saveFile(fn(r,"xlsx"),new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]))}
else{const{jsPDF}=window.jspdf,d=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),m=30,cw=(W-2*m)/r.head.length;let y=80;
d.setFillColor(11,18,32);d.rect(0,0,W,58,"F");d.setTextColor(255);d.setFontSize(16);d.text("FMS | "+r.title,m,30);d.setFontSize(9);d.text("Period: "+period()+"   Vehicle: "+(vf||"All")+"   Generated "+new Date().toLocaleString("en-GB"),m,46);d.setTextColor(0);
const row=(c,b)=>{d.setFontSize(8);d.setFont(undefined,b?"bold":"normal");const ln=c.map(x=>d.splitTextToSize(String(x),cw-5)),h=Math.max(...ln.map(l=>l.length))*10+6;if(y+h>H-30){d.addPage();y=40}if(b){d.setFillColor(222,232,244);d.rect(m,y-9,W-2*m,h,"F")}ln.forEach((l,i)=>d.text(l,m+i*cw+2,y));y+=h};
row(r.head,1);r.rows.forEach(x=>row(x));saveFile(fn(r,"pdf"),d.output("blob"))}}
function outAll(){if(!can("dl"))return toast("Your access level cannot download reports");if(!DB.trips.length)return toast("Import a report first");const wb=XLSX.utils.book_new();["sum","drv","trp","pnl"].forEach(k=>{const r=REP(k);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([r.head,...r.rows]),r.title.slice(0,30))});
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Date","Vehicle","Type","Category","Amount $","Note"],...FL().map(e=>[e.date,e.reg||"All",e.type,e.cat,e.amt,e.note])]),"Ledger");saveFile("FMS-full-workbook.xlsx",new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]))}

function tbl(h,rows,click){return`<div class="tw"><table><tr>${h.map((x,i)=>`<th${i?"":' class="l"'}>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr${click?` class="c" onclick="${click(r)}"`:""}>${r.cells.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}
const pc=n=>`<span class="${n>=0?"pos":"neg"}">${m$(n)}</span>`;
function vDash(){const ts=F(),p=pnl(),a=p.a,regs=[...new Set(ts.map(t=>t.reg))],seg=[["Fuel",a.fuel,"#f59e0b"],["Driver",a.drv,"#38bdf8"],["Idle",a.idle,"#a78bfa"],["Maint & tyres",a.mnt,"#2dd4bf"],["Fixed",a.fix,"#94a3b8"],["Other (ledger)",p.le,"#fb7185"]],tot=seg.reduce((s,x)=>s+x[1],0)||1;
const vs=regs.map(r=>({r,a:agg(ts.filter(t=>t.reg===r))})).sort((x,y)=>y.a.profit-x.a.profit),mx=Math.max(1,...vs.map(v=>Math.abs(v.a.profit)));
const al=ts.filter(t=>t.spd>R.spd).sort((x,y)=>y.spd-x.spd).slice(0,5),poly=regs.map(r=>{const pts=ts.filter(t=>t.reg===r&&t.lat!=null).sort((x,y)=>x.dep-y.dep).map(t=>P(t.lng,t.lat));if(!pts.length)return"";const l=pts[pts.length-1];return(pts.length>1?`<polyline points="${pts.map(x=>x.join(",")).join(" ")}" fill="none" stroke="${vcol(r)}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:"")+`<circle cx="${l[0]}" cy="${l[1]}" r="6" fill="${vcol(r)}" stroke="#0b1220" stroke-width="2"/>`}).join("");
return`<div class="kp"><div style="--c:var(--g)"><b>${m$(p.rv)}</b><span>Revenue</span></div><div style="--c:var(--o)"><b>${m$(p.tc)}</b><span>Total cost</span></div><div style="--c:${p.pr>=0?"var(--g)":"var(--r)"}"><b>${m$(p.pr)}</b><span>Net profit · ${p.mg.toFixed(0)}% margin</span></div><div style="--c:var(--b)"><b>${n1(a.km)} km</b><span>${a.n} trips · ${regs.length} vehicles</span></div></div>
<div class="two"><div class="card"><h3>Where the money goes</h3><div class="stk">${seg.map(s=>`<i style="width:${s[1]/tot*100}%;background:${s[2]}"></i>`).join("")}</div><div class="lg">${seg.map(s=>`<span><u style="background:${s[2]}"></u>${s[0]} ${m$(s[1])}</span>`).join("")}</div><h3 style="margin-top:16px">Budget</h3><div class="stk"><i style="width:${Math.min(100,p.bud?p.tc/p.bud*100:0)}%;background:${p.tc>p.bud?"var(--r)":"var(--g)"}"></i></div><small class="m">Spent ${m$(p.tc)} of ${m$(p.bud)} (${m$(R.bud)} per vehicle-day)</small>
<h3 style="margin-top:16px">Profit by vehicle</h3>${vs.map(v=>`<div class="hb"><span>${esc(v.r)}</span><div><i style="width:${Math.abs(v.a.profit)/mx*100}%;background:${v.a.profit>=0?"var(--g)":"var(--r)"}"></i></div><span class="${v.a.profit>=0?"pos":"neg"}">${m$(v.a.profit)}</span></div>`).join("")||'<p class="m">No trips in this period.</p>'}</div>
<div class="card"><h3>Live route map</h3><svg viewBox="0 0 740 650" style="width:100%;height:auto"><path d="M${B.map(b=>P(b[0],b[1]).join(",")).join("L")}Z" fill="#10233a" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>${poly}</svg><div class="lg">${regs.map(r=>`<span><u style="background:${vcol(r)}"></u>${esc(r)}</span>`).join("")}</div>
<h3 style="margin-top:14px">Speed alerts (over ${R.spd} km/h)</h3>${al.length?al.map(t=>`<div style="padding:5px 0;border-top:1px solid var(--line)"><b class="neg">${t.spd} km/h</b> · ${esc(t.reg)} · ${esc(t.drv)}<br><small class="m">${dstr(t)} ${hm(t.dep)} · near ${esc(t.to||t.from)}</small></div>`).join(""):'<p class="m">No speeding events. 👍</p>'}</div></div>`}

function renderAuth(){const tb=(k,l)=>`<button class="${AM===k?"on":""}" onclick="AM='${k}';MSG='';renderAuth()">${l}</button>`,f=(i,l,t,x)=>`<label>${l}</label><input id="${i}" type="${t||"text"}" required ${x||""}>`;
let body="";if(AM==="login")body=`<form onsubmit="doLogin(event)">${f("lc","Company ID","text",'placeholder="C12345" autocapitalize="characters"')}${f("lu","User ID")}${f("lp","Password","password")}<div class="err">${esc(MSG)}</div><button class="btn" style="width:100%">Sign in</button></form>`;
else if(AM==="reg")body=`<form onsubmit="doReg(event)">${f("rn","Company name")}${f("re","Contact email","email")}${f("rt","Phone","tel")}${f("rw","Your full name")}${f("ru","Choose your User ID")}${f("rp","Password (6+ characters)","password")}<div class="err">${esc(MSG)}</div><button class="btn" style="width:100%">Register company</button></form><p class="m">The administrator must approve your company before you can sign in.</p>`;
else if(AM==="admin")body=`<form onsubmit="doAdmin(event)">${f("ae","Admin email","email")}${f("ap","Password","password")}<div class="err">${esc(MSG)}</div><button class="btn" style="width:100%">Admin sign in</button></form>`;
else body=`<h2>Registration received ✅</h2><p class="m">Your Company ID is</p><div class="big">${esc(MSG)}</div><p class="m">Keep it safe. You will sign in with this ID, your User ID and password once the administrator approves your company.</p><button class="btn" onclick="AM='login';MSG='';renderAuth()">Go to sign in</button>`;
$("app").innerHTML=`<div class="au"><div class="logo"><i>₣</i><div><b>FMS</b><small>Fleet Financial Management</small></div></div><h1>Track every vehicle.<br>Control every dollar.</h1><p class="m">A private workspace for each company, with worker logins and separate access levels.</p><div class="card">${AM==="done"?"":`<div class="tabs">${tb("login","Company login")}${tb("reg","Register")}${tb("admin","Admin")}</div>`}${body}${LIVE?"":'<p class="m" style="margin-top:12px"><small>DEMO MODE: data stays in this browser and is not secure.<br>Admin: admin@fms.demo / admin123<br>Demo company: C10001 · owner · owner123</small></p>'}</div></div>`}
function renderAdmin(){const n=s=>CO.filter(c=>c.p.status===s).length,act=c=>`<button class="btn g" onclick="coOpen('${c.id}')">Open</button> ${c.p.status==="active"?`<button class="btn g" onclick="coSet('${c.id}','suspended')">Suspend</button>`:`<button class="btn" onclick="coSet('${c.id}','active')">${c.p.status==="pending"?"Approve":"Reactivate"}</button>`} <button class="btn g" onclick="coDel('${c.id}')">Delete</button>`;
$("app").innerHTML=`<header><div class="logo"><i>₣</i><div><b>Admin console</b><small>All companies</small></div></div><button class="btn g" onclick="logout()">Sign out</button></header><main style="padding-top:12px"><div class="kp"><div style="--c:var(--b)"><b>${CO.length}</b><span>Companies</span></div><div style="--c:var(--g)"><b>${n("active")}</b><span>Active</span></div><div style="--c:var(--o)"><b>${n("pending")}</b><span>Awaiting approval</span></div><div style="--c:var(--r)"><b>${n("suspended")}</b><span>Suspended</span></div></div><div class="card"><h2>Companies</h2>${CO.length?tbl(["Company","Contact","Status","Vehicles","Trips","Staff","Registered",""],CO.map(c=>({cells:[`<b>${esc(c.p.name||c.id)}</b><br><small class="m">${c.id}</small>`,esc(c.p.email||""),`<span class="sp ${c.p.status}">${c.p.status}</span>`,c.v,c.t,c.s,c.p.created?new Date(c.p.created).toLocaleDateString("en-GB"):"",act(c)]}))):'<p class="m">No companies registered yet.</p>'}</div>${LIVE?"":'<p class="m">DEMO MODE: data stays in this browser.</p>'}</main>`}
function renderWS(){const s=S.sess,co=s.company||{},T=["dash","veh","trp","drv"].concat(can("fleet")?["flt"]:[],can("ledger")?["led"]:[],can("rates")?["rat"]:[],can("reports")?["rep"]:[],can("staff")?["stf"]:[]);if(!T.includes(tab))tab="dash";
const V={dash:vDash,veh:vVeh,trp:vTrp,drv:vDrv,flt:vFlt,led:vLed,rat:vRat,rep:vRep,stf:vStf},regs=Object.keys(DB.assets),has=regs.length&&DB.trips.some(t=>DB.assets[t.reg]);
const hero=`<div class="card hero"><h1>${regs.length?"Import your first report":"Add your fleet"}</h1><p class="m">${can("import")?"Add the vehicles you want to track, then import a Daily Movement Report (.xlsx or .csv). FMS extracts trips, drivers, distance, driving and standing time, speed and locations, then costs it.":"No data yet. A Manager or Owner needs to import a report."}</p>${can("import")?`<button class="btn" onclick="$('fi').click()">⬆ Import a report</button> ${can("fleet")?`<button class="btn g" onclick="tab='flt';render()">Add vehicles</button>`:""} ${typeof SAMPLE!=="undefined"&&SAMPLE?`<button class="btn g" onclick="loadSample()">Try the sample report</button>`:""}`:""}</div>`;
$("app").innerHTML=`<header><div class="logo"><i>₣</i><div><b>${esc(co.name||"FMS")}</b><small>${S.cid} · ${esc(s.name)} · ${LV[s.level].n}</small></div></div><div class="bar" style="margin:0">${s.role==="admin"?'<button class="btn g" onclick="back()">← Admin</button>':""}<button class="btn g" onclick="logout()">Sign out</button></div></header><nav>${T.map(k=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${TN[k]}</button>`).join("")}</nav><main>${LIVE?"":'<p class="m"><small>DEMO MODE · data stays in this browser</small></p>'}
<div class="bar"><select onchange="vf=this.value;render()"><option value="">All vehicles</option>${regs.map(r=>`<option${r===vf?" selected":""}>${esc(r)}</option>`).join("")}</select><input type="date" value="${from}" onchange="from=this.value;render()" aria-label="From"><input type="date" value="${to}" onchange="to=this.value;render()" aria-label="To">${can("import")?'<button class="btn" onclick="$(\'fi\').click()">⬆ Import report</button>':""}</div>${["flt","led","rat","stf"].includes(tab)||has?V[tab]():hero}</main>`}
function render(){if(!S.sess)return renderAuth();if(S.sess.role==="admin"&&!S.cid)return renderAdmin();renderWS()}
$("fi").onchange=e=>{const f=e.target.files[0];e.target.value="";f&&doImport(f)};
init();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
